name: NGVKauction
version: '1.1'
main: ua.nagivka.nGVKauction.NGVKauction
api-version: '1.21'
depend: [Vault]
softdepend: [Oraxen, ItemsAdder, Nexo, PlaceholderAPI]

libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.xerial:sqlite-jdbc:3.45.2.0

commands:
  ah:
    description: Главная команда аукциона
    aliases: [auction]

permissions:
  ngvkauctions.use:
    default: true
  ngvkauctions.sell:
    default: true
  ngvkauctions.admin:
    default: op