name: NGVKauction
version: '1.0'
main: ua.nagivka.nGVKauction.NGVKauction
api-version: '1.21'
depend: [Vault]
softdepend: [Oraxen, ItemsAdder, PlaceholderAPI]

commands:
  ah:
    description: Главная команда аукциона
    aliases: [auction]

permissions:
  ngvkauctions.use:
    default: true
  ngvkauctions.sell:
    default: true
  ngvkauctions.admin:
    default: op