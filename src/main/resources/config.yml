config-version: '1.2'

settings:
  prefix: '&#cfa151[Аукцион] &r'
  min-price: 10.0
  max-price: 100000000.0
  default-slots: 3
  expire-hours: 48
  tax-rate: 5.0 # Процент комиссии с успешной продажи
  expiration-check-interval-seconds: 30
  
  # Комиссия за сам факт выставления лота на аукцион
  listing-fee:
    enabled: true
    percent: 1.0 # Процент от цены выставления (например, 1% от $1000 = $10)
    fixed: 0.0   # Либо фиксированная сумма (будет прибавлена к проценту)

  # Стоимость продления лота (0.0 = бесплатно)
  prolong-fee: 0.0

  # Авто-обновление открытого меню в реальном времени (без мерцания и щелчков)
  auto-refresh:
    enabled: true
    interval-seconds: 5

database:
  type: 'SQLITE' # Варианты: SQLITE, MYSQL, MARIADB
  host: 'localhost'
  port: 3306
  database: 'minecraft'
  username: 'root'
  password: ''
  pool-size: 10 # Для MySQL/MariaDB (для SQLite автоматически равен 1)

sounds:
  enabled: true
  open-menu: 'BLOCK_CHEST_OPEN'
  click: 'UI_BUTTON_CLICK'
  buy-success: 'ENTITY_PLAYER_LEVELUP'
  receive-money: 'ENTITY_EXPERIENCE_ORB_PICKUP'
  receive-item: 'ENTITY_ITEM_PICKUP'
  error: 'ENTITY_VILLAGER_NO'

# Расширенный черный список предметов
blacklist:
  materials:
    - 'BEDROCK'
    - 'BARRIER'
    - 'COMMAND_BLOCK'
    - 'CHAIN_COMMAND_BLOCK'
    - 'REPEATING_COMMAND_BLOCK'
    - 'STRUCTURE_BLOCK'
    - 'JIGSAW'
    - 'LIGHT'
  name-contains:
    - '[Запрещено]'
  lore-contains:
    - 'Нельзя передавать'
    - 'Персональный предмет'
    - 'Квестовый предмет'
  custom-model-data: []